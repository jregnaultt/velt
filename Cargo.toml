[package]
name = "velt"
version = "0.1.0"
edition = "2021"
description = "Velt — Native GPU-accelerated Rust terminal for developers, AI agents, and Git/Atlassian workflows"

[dependencies]
iced = { version = "0.13", features = ["canvas", "tokio", "advanced"] }
portable-pty = "0.8"
alacritty_terminal = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
